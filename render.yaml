services:
  - type: web
    name: securemove-backend
    runtime: node
    rootDir: securemove-backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: securemove-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TICKET_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: MOBILE_MONEY_MODE
        value: lenco
      - key: LENCO_PUBLIC_KEY
        sync: false
      - key: LENCO_SECRET_KEY
        sync: false
      - key: LENCO_BASE_URL
        value: https://api.lenco.co
      - key: LENCO_COUNTRY
        value: zm
      - key: LENCO_BEARER
        value: merchant
      - key: AIRTEL_ENVIRONMENT_MODE
        value: staging
      - key: AIRTEL_COUNTRY
        value: ZM
      - key: AIRTEL_CURRENCY
        value: ZMW

databases:
  - name: securemove-db
    plan: free
    databaseName: securemove
    postgresMajorVersion: "17"
