services:
  db:
    image: postgres:16-alpine
    container_name: securemove-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: securemove
      POSTGRES_PASSWORD: securemove_pass
      POSTGRES_DB: securemove
    ports:
      - "5432:5432"
    volumes:
      - securemove_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securemove -d securemove"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  securemove_pgdata:
