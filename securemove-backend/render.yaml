services:
  - type: web
    name: securemove-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: securemove-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: MOBILE_MONEY_MODE
        value: mock
      - key: AIRTEL_ENVIRONMENT_MODE
        value: staging
      - key: AIRTEL_COUNTRY
        value: ZM
      - key: AIRTEL_CURRENCY
        value: ZMW

databases:
  - name: securemove-db
    plan: free
    databaseName: securemove
    postgresMajorVersion: "17"
